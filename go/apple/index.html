<!-- OPEN GRAPH ON A BRIDGE, WHICH THE 6.8 SLUGS DO NOT HAVE AND DO NOT NEED.
     Those get pasted into a profile field. These get pasted into a Facebook post, and Facebook
     scrapes the URL IT WAS GIVEN — this page, not Spotify. Without these five tags the post
     renders as a grey box with the word "מעביר" in it, which is a worse card than a bare link. -->
<meta property="og:type" content="website">
<meta property="og:title" content="הכיסא האנושי · The Human Chair">
<meta property="og:description" content="בכל פרק בן אדם אחד יושב בכיסא, וסוכני בינה מלאכותית מראיינים אותו. השאלה עוברת הלאה מפרק לפרק, ואף פעם לא נשאלת פעמיים.">
<meta property="og:image" content="https://connecthedots.co/the-human-chair/cover.png">
<meta property="og:site_name" content="Connecting the Dots">
<meta name="twitter:card" content="summary_large_image">
<script>
(function(){
  // NO posthog.js HERE, DELIBERATELY, AND IT COST A TEST TO LEARN IT.
  // The first version of this bridge loaded the snippet and called posthog.capture().
  // The snippet is a stub that queues calls until array.js downloads, and we redirect long
  // before that lands, so every event was queued into a page that no longer existed.
  // Verified 20.8 on a local server: the redirect fired, Spotify loaded, and PostHog received
  // nothing. A bridge that silently counts zero is worse than no bridge, because it produces
  // the third kind of zero and calls it a market result.
  // sendBeacon straight to the capture endpoint needs no library and is handed to the browser
  // before navigation. text/plain keeps it a simple request, so there is no CORS preflight to lose.
  var DEST = "https://podcasts.apple.com/il/podcast/%D7%94%D7%9B%D7%99%D7%A1%D7%90-%D7%94%D7%90%D7%A0%D7%95%D7%A9%D7%99-the-human-chair/id6803072523";
  var q = new URLSearchParams(location.search);
  // Never guess a missing parameter. "unspecified" is a readable answer; a defaulted one is a
  // wrong answer that looks right.
  var src = q.get("s") || q.get("utm_source") || "unspecified";
  var camp = q.get("c") || q.get("utm_campaign") || "unspecified";

  // Reuse the visitor id the main site already set, so a click here and a visit there are one
  // person. Fall back to a fresh id rather than dropping the event.
  var did = "";
  try {
    var m = document.cookie.match(/ph_phc_[^=]+_posthog=([^;]+)/);
    if (m) did = (JSON.parse(decodeURIComponent(m[1])) || {}).distinct_id || "";
  } catch (e) {}
  if (!did) did = "bridge_" + Math.random().toString(36).slice(2) + Date.now().toString(36);

  try {
    var payload = JSON.stringify({
      api_key: "phc_E7RT8uONsICJRF5lKqYhsyys29rP0BKObdRHyYSCdQx",
      event: "bridge_click",
      properties: {
        distinct_id: did,
        bridge: "apple",
        platform: "Apple Podcasts",
        source: src,
        campaign: camp,
        destination: DEST,
        $current_url: location.href,
        $referrer: document.referrer || "$direct"
      }
    });
    navigator.sendBeacon("https://us.i.posthog.com/e/",
      new Blob([payload], { type: "text/plain" }));
  } catch (e) {}

  location.replace(DEST);
})();
</script>
